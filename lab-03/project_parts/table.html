<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця</title>
</head>

<body>
<table border="2" cellspacing="0" cellpadding="0">
    <tr>
        <td bgcolor="#33ffcc" colspan="8" width="400" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="#ffffcc" rowspan="6" width="50" height="50"></td>
        <td bgcolor="#33ffcc" colspan="6" width="300" height="50"></td>
        <td bgcolor="#ffffcc" rowspan="6" width="50" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="#ffffcc" rowspan="4" width="50" height="50"></td>
        <td bgcolor="#33ffcc" colspan="4" width="200" height="50"></td>
        <td bgcolor="#ffffcc" rowspan="4" width="50" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="#ffffcc" rowspan="2" width="50" height="50"></td>
        <td bgcolor="red" width="50" height="50"></td>
        <td bgcolor="blue" width="50" height="50"></td>
        <td bgcolor="#ffffcc" rowspan="2" width="50" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="lime" width="50" height="50"></td>
        <td bgcolor="yellow" width="50" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="#33ffcc" colspan="4" width="200" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="#33ffcc" colspan="6" width="300" height="50"></td>
    </tr>
    <tr>
        <td bgcolor="#33ffcc" colspan="8" width="400" height="50"></td>
    </tr>
</table>
<p><a href="../index.html">Повернутись на головну</a></p>
</body>


</html>
